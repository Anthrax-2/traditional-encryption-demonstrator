<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="{{ url_for('static', filename='script.js') }}" defer></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Traditional Encryption Methods Demonstrator</title>
    </head>
    <body>

        <div class="all">
            <header>
                <h1>Welcome to my TEMC!</h1>
                <p>By: Amer Tarek Aziz</p>
                <p>My GitHub:</p><a href="https://github.com/Anthrax-2">https://github.com/Anthrax-2</a>
            </header>
            <div class="content">
                <label for="methods">Select encryption method:</label>
                <select id="methods">
                    {% for key in ciphers %}
                        <option value="{{ key }}">{{ key }}</option>
                    {% endfor %}
                </select>
                <label for="input">Enter text:</label>
                <input type="text" name="input" id="input">
                <label for="key">Enter key:</label>
                <input type="text" name="key" id="key">
                <label for="output">Output:</label>
                <input type="text" name="output" id="output" readonly>
                <div class="modes">
            
                    <label for="encrypt"><input type="radio" name="mode" id="encrypt" value="encrypt" checked> Encrypt </label>
            
                    <label for="decrypt"><input type="radio" name="mode" id="decrypt" value="decrypt"> Decrypt </label>
            
                </div>
                <button type="button"  id="enter">Enter</button>
                <p id="error"></p>
            </div>
        </div>
    </body>

    
</html>
